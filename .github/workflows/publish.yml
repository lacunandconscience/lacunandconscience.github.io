name: Publish Lacuna & Conscience
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack website
        run: |
          mkdir -p public
          unzip -oq "Lacuna-and-Conscience-GITHUB-PAGES (5).zip" -d public
          test -f public/index.html
          # Override outdated archive copies with the current published catalog and PDF.
          cp papers.json public/papers.json
          cp beyond-the-grave.pdf public/beyond-the-grave.pdf
          # Always publish the same canonical stylesheet and site assets.
          cp styles.css public/styles.css
          cp script.js public/script.js
          cp reader.js public/reader.js
          cp reader.html public/reader.html
          cp research-list.js public/research-list.js
          # Use relative navigation so the site works at the account's root URL.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('public').rglob('*'):
              if p.is_file() and p.suffix in ('.html', '.js'):
                  content = p.read_text(encoding='utf-8')
                  target = '../../research.html' if p.parent.as_posix().endswith('lavanya/research') else 'research.html'
                  updated = content.replace('/lavanya/research/', target)
                  if updated != content:
                      p.write_text(updated, encoding='utf-8')
          PY
          # Short, readable research paper URL, while retaining the existing reader.
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('public')
          catalog = root / 'papers.json'
          if catalog.exists():
              data = json.loads(catalog.read_text(encoding='utf-8'))
              if 'beyond-the-grave' in data:
                  data['beyond-the-grave']['file'] = 'beyond-the-grave.pdf'
              catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          # Lock the visual theme to the version-controlled stylesheet.
          assert (root / 'styles.css').read_bytes() == Path('styles.css').read_bytes()
          reader = (root / 'reader.html').read_text(encoding='utf-8')
          reader = reader.replace('<head>', '<head><base href="../">', 1)
          reader = reader.replace('href="lavanya/research/"', 'href="research.html"')
          reader = reader.replace('<script src="reader.js?v=2"></script>', '<script src="reader-short.js"></script>')
          short_dir = root / 'beyond-the-grave'
          short_dir.mkdir(exist_ok=True)
          (short_dir / 'index.html').write_text(reader, encoding='utf-8')
          reader_js = (root / 'reader.js').read_text(encoding='utf-8')
          reader_js = reader_js.replace("new URLSearchParams(location.search).get('paper')", "'beyond-the-grave'")
          reader_js = reader_js.replace('new URL(paper.file, location.href)', 'new URL(paper.file, document.baseURI)')
          reader_js = reader_js.replace("fetch('papers.json'", "fetch(new URL('papers.json', document.baseURI)" )
          (root / 'reader-short.js').write_text(reader_js, encoding='utf-8')
          research_js = root / 'research-list.js'
          if research_js.exists():
              script = research_js.read_text(encoding='utf-8')
              script = script.replace("a.href=(location.pathname.includes('/lavanya/research/')?'../../reader.html':'reader.html')+'?paper='+encodeURIComponent(id);", "a.href=id==='beyond-the-grave'?'beyond-the-grave/':'reader.html?paper='+encodeURIComponent(id);")
              research_js.write_text(script, encoding='utf-8')
          research_html = root / 'research.html'
          if research_html.exists():
              html = research_html.read_text(encoding='utf-8').replace('reader.html?paper=beyond-the-grave', 'beyond-the-grave/')
              research_html.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
