name: Publish Lacuna & Conscience
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack website
        run: |
          mkdir -p public
          unzip -oq "Lacuna-and-Conscience-GITHUB-PAGES (5).zip" -d public
          test -f public/index.html
          # Override outdated archive copies with the current published catalog and PDF.
          cp papers.json public/papers.json
          cp beyond-the-grave.pdf public/beyond-the-grave.pdf
          # Remove pale side gutters from the Lady Justice hero photo only.
          # Keep the original typography, masthead, patterns and all other colours.
          python3 - <<'PY'
          from pathlib import Path
          css = Path('public/styles.css')
          css.write_text(css.read_text(encoding='utf-8') + """
/* Full-bleed Lady Justice photograph: prevent pale side bars. */
.editorial-photo{background:#050505}
.editorial-photo img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.29);transform-origin:center}
""",encoding='utf-8')
          PY
          # Restore the original cream editorial cards without altering the textured background.
          python3 - <<'PY'
          from pathlib import Path
          css = Path('public/styles.css')
          css.write_text(css.read_text(encoding='utf-8') + """
/* Locked journal card palette: warm cream surfaces and dark brown lettering. */
.paper-item,.paper-item:hover,.question,.question:hover{
  background:#f6f0e5!important;
  background-image:none!important;
  color:#2b1c14!important;
  border-color:rgba(77,56,45,.3)!important;
}
.paper-item h3,.paper-item p,.paper-item a,.question .q,.question h3,.question p{
  color:#2b1c14!important;
}
.paper-item .paper-no,.paper-item .status,.question .topic{
  color:#742d3a!important;
}
""",encoding='utf-8')
          PY
          # Restore the polka-dot closing panel on The Unsettled only.
          python3 - <<'PY'
          from pathlib import Path
          css=Path('public/styles.css')
          css.write_text(css.read_text(encoding='utf-8')+"""
/* The Unsettled: original cream polka-dot closing statement. */
body.unsettled-page .manifesto,body.polka-page .manifesto{
  background-color:#f7f3e9!important;
  background-image:radial-gradient(circle,#8d6964 1.8px,transparent 2px)!important;
  background-size:25px 25px!important;
  color:#2c1b15!important;
}
body.unsettled-page .manifesto-inner,body.polka-page .manifesto-inner{
  background:transparent!important;box-shadow:none!important;
}
body.unsettled-page .manifesto blockquote,body.polka-page .manifesto blockquote{
  color:#2c1b15!important;text-shadow:none!important;
}
body.unsettled-page .manifesto cite,body.polka-page .manifesto cite{
  color:#5b453b!important;
}
""",encoding='utf-8')
          page=Path('public/questions.html')
          html=page.read_text(encoding='utf-8')
          html=html.replace('<body','<body class="unsettled-page"' ,1) if '<body class=' not in html else html.replace('<body class="','<body class="unsettled-page ',1)
          page.write_text(html,encoding='utf-8')
          PY
          # Use relative navigation so the site works at the account's root URL.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('public').rglob('*'):
              if p.is_file() and p.suffix in ('.html', '.js'):
                  content = p.read_text(encoding='utf-8')
                  target = '../../research.html' if p.parent.as_posix().endswith('lavanya/research') else 'research.html'
                  updated = content.replace('/lavanya/research/', target)
                  if updated != content:
                      p.write_text(updated, encoding='utf-8')
          PY
          # Short, readable research paper URL, while retaining the existing reader.
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('public')
          catalog = root / 'papers.json'
          if catalog.exists():
              data = json.loads(catalog.read_text(encoding='utf-8'))
              if 'beyond-the-grave' in data:
                  data['beyond-the-grave']['file'] = 'beyond-the-grave.pdf'
              catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          reader = (root / 'reader.html').read_text(encoding='utf-8')
          reader = reader.replace('<head>', '<head><base href="../">', 1)
          reader = reader.replace('href="lavanya/research/"', 'href="research.html"')
          reader = reader.replace('<script src="reader.js?v=2"></script>', '<script src="reader-short.js"></script>')
          short_dir = root / 'beyond-the-grave'
          short_dir.mkdir(exist_ok=True)
          (short_dir / 'index.html').write_text(reader, encoding='utf-8')
          reader_js = (root / 'reader.js').read_text(encoding='utf-8')
          reader_js = reader_js.replace("new URLSearchParams(location.search).get('paper')", "'beyond-the-grave'")
          reader_js = reader_js.replace('new URL(paper.file, location.href)', 'new URL(paper.file, document.baseURI)')
          reader_js = reader_js.replace("fetch('papers.json'", "fetch(new URL('papers.json', document.baseURI)" )
          (root / 'reader-short.js').write_text(reader_js, encoding='utf-8')
          research_js = root / 'research-list.js'
          if research_js.exists():
              script = research_js.read_text(encoding='utf-8')
              script = script.replace("a.href=(location.pathname.includes('/lavanya/research/')?'../../reader.html':'reader.html')+'?paper='+encodeURIComponent(id);", "a.href=id==='beyond-the-grave'?'beyond-the-grave/':'reader.html?paper='+encodeURIComponent(id);")
              research_js.write_text(script, encoding='utf-8')
          research_html = root / 'research.html'
          if research_html.exists():
              html = research_html.read_text(encoding='utf-8').replace('reader.html?paper=beyond-the-grave', 'beyond-the-grave/')
              research_html.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
